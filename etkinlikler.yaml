# ─────────────────────────────────────────────────────────────
# Aion 2 bildirim listesi
#
# Yeni bir hatırlatma eklemek için aşağıya bir etkinlik bloğu ekle.
# Kaydet + commit et, başka hiçbir şeye dokunmana gerek yok.
#
# Alanlar:
#   ad          : Kısa isim (sadece loglarda görünür)
#   aktif       : false yaparsan bildirim gitmez
#   saatler     : Türkiye saatiyle etkinlik saatleri ("HH:MM")
#   gunler      : (isteğe bağlı) sadece bu günlerde: pzt sal car per cum cmt paz
#   sure_dk     : (isteğe bağlı) etkinlik kaç dk sürüyor, {bitis} için
#   rol         : (isteğe bağlı) etiketlenecek rol. Secret adı ya da direkt ID.
#   bildirimler : Etkinliğe göre dakika farkı (-10 = 10 dk önce, 5 = 5 dk sonra)
#     renk      : Kartın rengi (#RRGGBB)
#     baslik    : Büyük başlık
#     aciklama  : Kart metni. {saat} = etkinlik saati, {bitis} = bitiş saati
# ─────────────────────────────────────────────────────────────

etkinlikler:

  - ad: rift
    aktif: true
    # Avrupa 25 Ekim 2026'da saat geri aldı (CEST → CET), Türkiye saati sabit kaldığı için
    # rift saatleri Türkiye saatiyle 1 saat ileri kaydı.
    saatler: ["01:00", "04:00", "07:00", "10:00", "13:00", "16:00", "19:00", "22:00"]
    sure_dk: 10
    rol: DISCORD_ROLE_ID
    bildirimler:
      - fark: -10
        renk: "#F1C40F"
        baslik: "⏳ RIFT 10 DAKİKA SONRA AÇILIYOR"
        aciklama: "Hazırlanın, portal **{saat}**'te açılacak."
      - fark: -5
        renk: "#E67E22"
        baslik: "⚠️ RIFT 5 DAKİKA SONRA AÇILIYOR"
        aciklama: "Portal **{saat}**'te açılıyor. Karakterinizi hazırlayın!"
      - fark: 0
        renk: "#2ECC71"
        baslik: "🌀 RIFT AÇILDI! GİRİŞE SON 10 DAKİKA"
        aciklama: "Portal açık, giriş **{bitis}**'te kapanıyor. Hemen girin!"
      - fark: 5
        renk: "#E74C3C"
        baslik: "🚨 RIFT GİRİŞİ 5 DAKİKA SONRA KAPANIYOR"
        aciklama: "Son şans! Giriş **{bitis}**'te kapanıyor."

  # ── World Boss'lar: Immortal Gartua + High Commander Lagta ──
  # Sabit saat, 12 saatte bir. Lagta, Gartua'dan ~4 dk sonra çıkıyor.
  # İkisi tek mesajda bildiriliyor (kanal spam olmasın diye).
  # Konumlar Asmodian tarafı içindir.
  - ad: world-boss
    aktif: false        # Kapalı: saatler değişti (10 Ekim 2026). Yeni saatlerle açılabilir.
    saatler: ["04:00", "16:00"]
    sure_dk: 4          # {bitis} = Lagta'nın çıkış saati
    rol: DISCORD_ROLE_ID
    # "resimli: true" olan bildirimlerde harita resimleri de gönderilir
    resimler:
      - baslik: "📍 Immortal Gartua · Immortal Isle"
        dosya: img/gartua.png
      - baslik: "📍 High Commander Lagta · Lagta Fortress"
        dosya: img/lagta.png
    bildirimler:
      - fark: -60
        renk: "#3498DB"
        resimli: true
        baslik: "🐉 WORLD BOSS'LARA 1 SAAT VAR"
        aciklama: "**Immortal Gartua** ~{saat} · 📍 Immortal Isle\n**High Commander Lagta** ~{bitis} · 📍 Lagta Fortress\nSaatler tahminidir, oyundaki sayaca da bakın."
      - fark: -30
        renk: "#F1C40F"
        baslik: "🐉 WORLD BOSS'LARA 30 DAKİKA VAR"
        aciklama: "**Immortal Gartua** ~{saat} · 📍 Immortal Isle\n**High Commander Lagta** ~{bitis} · 📍 Lagta Fortress\nHazırlanmaya başlayın."
      - fark: -10
        renk: "#E67E22"
        resimli: true
        baslik: "⚠️ WORLD BOSS'LARA 10 DAKİKA VAR"
        aciklama: "**Immortal Gartua** ~{saat} · 📍 Immortal Isle\n**High Commander Lagta** ~{bitis} · 📍 Lagta Fortress\nBölgeye gidin, toplanın!"
      - fark: -5
        renk: "#E74C3C"
        baslik: "🚨 WORLD BOSS'LARA 5 DAKİKA VAR"
        aciklama: "**Immortal Gartua** ~{saat} · 📍 Immortal Isle\n**High Commander Lagta** ~{bitis} · 📍 Lagta Fortress\nYerinizi alın!"

  # ── Örnek: haftalık sıfırlama hatırlatması (aktif: true yapınca çalışır) ──
  - ad: haftalik-sifirlama
    aktif: false
    saatler: ["20:00"]
    gunler: [sal]
    rol: DISCORD_ROLE_ID
    bildirimler:
      - fark: 0
        renk: "#9B59B6"
        baslik: "📅 HAFTALIK İŞLERİ BİTİRDİN Mİ?"
        aciklama: "Yarın sabah haftalık sıfırlama var. Dungeon, Ascension Trial ve Abyss Point limitlerini kontrol et."
