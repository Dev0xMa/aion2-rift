name: Aion 2 Bildirim Botu

on:
  # cron-job.org her 5 dakikada bir bu workflow'u API ile tetikler.
  # Hangi bildirimin ne zaman gidecegi etkinlikler.yaml dosyasinda.
  workflow_dispatch:
    inputs:
      test:
        description: "Her aktif etkinlikten bir test mesaji gonder"
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

jobs:
  bildirim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyyaml
      - name: Bildirimleri gonder
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: python3 bot.py
