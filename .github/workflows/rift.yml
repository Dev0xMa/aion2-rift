name: Aion 2 Rift Uyarici

on:
  # Zamanlama cron-job.org'dan geliyor: TR 23,02,05,...,20 saatlerinde :35'te
  # bu workflow'u API ile tetikler. Is bildirimleri (R-10, R-5, R, R+5)
  # tam saatinde kendisi atar.
  workflow_dispatch:
    inputs:
      test:
        description: "4 bildirimin hepsini simdi test olarak gonder"
        type: boolean
        default: true

concurrency:
  group: rift
  cancel-in-progress: false

jobs:
  uyari:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Rift bildirimleri
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: python3 rift_bot.py
